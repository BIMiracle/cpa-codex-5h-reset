name: Build CPA plugin
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, goos: linux, goarch: amd64, ext: so }
          - { os: ubuntu-24.04-arm, goos: linux, goarch: arm64, ext: so }
          - { os: macos-15-intel, goos: darwin, goarch: amd64, ext: dylib }
          - { os: macos-15, goos: darwin, goarch: arm64, ext: dylib }
          - { os: windows-2025, goos: windows, goarch: amd64, ext: dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Test and build
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          PLUGIN_EXT: ${{ matrix.ext }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GOOS -eq 'windows') {
            $env:CC = 'C:\msys64\mingw64\bin\gcc.exe'
            $env:PATH = 'C:\msys64\mingw64\bin;' + $env:PATH
          }
          go test -race ./...
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Vet failed' }
          node --test web/app.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser logic tests failed' }
          $version = '0.2.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $library = "dist/cpa-codex-5h-reset.$env:PLUGIN_EXT"
          go build -trimpath -buildmode=c-shared "-ldflags=-s -w -X main.pluginVersion=$version" -o $library .
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          python scripts/abi-smoke.py $library
          if ($LASTEXITCODE -ne 0) { throw 'ABI smoke failed' }
          $zip = "dist/cpa-codex-5h-reset_${version}_$($env:GOOS)_$($env:GOARCH).zip"
          Compress-Archive -LiteralPath $library -DestinationPath $zip
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: dist
          merge-multiple: true
      - name: Publish verified artifacts
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum *.zip > checksums.txt
          gh release create "$GITHUB_REF_NAME" ./*.zip checksums.txt --verify-tag --generate-notes
