name: Build Windows CPA plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...

  release:
    needs: verify
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Build and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $id = 'cpa-codex-window-keeper'
          $dll = Join-Path $PWD "$id.dll"
          $zip = Join-Path $PWD "$($id)_$($version)_windows_amd64.zip"
          $env:CGO_ENABLED = '1'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CC = 'C:\msys64\mingw64\bin\gcc.exe'
          go build -trimpath -buildmode=c-shared -ldflags='-s -w' -o $dll .
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          Compress-Archive -LiteralPath $dll -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -Path checksums.txt -Encoding ascii
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem -File -Filter 'cpa-codex-window-keeper_*.zip' | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path -LiteralPath '.\checksums.txt').Path
          gh release create '${{ github.ref_name }}' @assets --repo '${{ github.repository }}' --verify-tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64-plugin
          path: |
            cpa-codex-window-keeper_*.zip
            checksums.txt
